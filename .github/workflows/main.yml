name: Crear APK Gestor de Máquinas

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Descomprimir proyecto
        run: |
          unzip -q Gestor_Maquinas_V8_GITHUB_LISTO.zip -d proyecto

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compilar APK
        working-directory: proyecto/github_ready
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-Maquinas-V8-APK
          path: proyecto/github_ready/app/build/outputs/apk/debug/app-debug.apk
